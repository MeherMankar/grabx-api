name: grabx-api
services:
  - name: grabx-api
    type: web
    git:
      repository: github.com/MeherMankar/grabx-api
      branch: master
    docker:
      dockerfile: Dockerfile
    instance_type: free
    regions:
      - was         # Washington DC — good for US/Asia latency
    ports:
      - port: 8000
        protocol: http
    health_checks:
      - http:
          path: /health
          port: 8000
    env:
      - name: TERABOX_COOKIE
        value: ""          # set in Koyeb dashboard
        secret: true
      - name: API_KEY
        value: ""          # set in Koyeb dashboard
        secret: true
      - name: REDIS_URL
        value: ""          # required — set to a Redis-compatible service URL
        secret: true
      - name: APP_ENV
        value: production
      - name: CF_WORKER_URL
        value: ""          # optional
      - name: PROXY_TOKEN_TTL_HOURS
        value: "24"
  - name: grabx-worker
    type: worker
    git:
      repository: github.com/MeherMankar/grabx-api
      branch: master
    docker:
      dockerfile: Dockerfile
      command:
        - rq
        - worker
        - grabx
    instance_type: free
    regions:
      - was
    env:
      - name: API_KEY
        value: ""          # use the same value as grabx-api
        secret: true
      - name: REDIS_URL
        value: ""          # use the same Redis URL as grabx-api
        secret: true
      - name: APP_ENV
        value: production
      - name: PROXY_URL
        value: ""          # optional — use the same proxy pool as grabx-api
        secret: true
